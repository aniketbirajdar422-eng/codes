<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Table Example</title>
</head>
<body>
    <table border="1">
        <tr>
            <th rowspan="2" style="text-align: center;">Name</th>
            <th rowspan="2" style="text-align: center;">Id</th>
            <th colspan="3"style="text-align: center;">Subjects</th>
            <th>Total</th>

        </tr>

        <tr>
            <th>Math</th>
            <th>Science</th>
            <th>English</th>

        </tr>
        
        <tr>
            <td>1</td>
            <td>John</td>
            <td>90</td>
            <td>85</td>
            <td>88</td>
            <td>263</td>

        </tr>

        <tr>
            <td>2</td>
            <td>Jane</td>
            <td>92</td>
            <td>89</td>
            <td>91</td>
            <td>272</td>
        </tr>
        <footer>
            <tr></tr>
        </footer>
    </table>
</body>
</html>
